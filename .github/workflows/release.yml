name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      MLX_PREBUILT_PATH: ${{ runner.temp }}/mlx-prebuilt-v0.1.0-macos-arm64
      RECOGUI_CARGO_PROFILE: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `v${packageJson.version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.RELEASE_TAG}`);
          }
          EOF

      - name: Prepare prebuilt MLX
        run: bash .github/scripts/prepare-mlx.sh

      - name: Verify source
        timeout-minutes: 10
        run: pnpm verify

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseName: RecoGUI ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          tauriScript: bash .github/scripts/build-release.sh
          args: --target aarch64-apple-darwin --bundles app --no-sign
