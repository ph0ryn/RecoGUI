[package]
# Vendored from OminiX-MLX commit 4988a3fcfa48b8cb5d0780a501b92c6a41401523.
# Local changes add language detection, token counts, and fail-fast model loading.
name = "qwen3-asr-mlx"
version = "1.0.0"
edition = "2021"
description = "Qwen3-ASR speech recognition on Apple Silicon with MLX"
license = "MIT OR Apache-2.0"

[dependencies]
mlx-rs = { git = "https://github.com/OminiX-ai/OminiX-MLX", rev = "4988a3fcfa48b8cb5d0780a501b92c6a41401523", features = ["metal", "accelerate"] }
mlx-sys = { git = "https://github.com/OminiX-ai/OminiX-MLX", rev = "4988a3fcfa48b8cb5d0780a501b92c6a41401523" }
mlx-rs-core = { git = "https://github.com/OminiX-ai/OminiX-MLX", rev = "4988a3fcfa48b8cb5d0780a501b92c6a41401523" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
thiserror = "2"
rubato = "0.16"
hound = "3.5"
rustfft = "6.2"
dirs = "5"
